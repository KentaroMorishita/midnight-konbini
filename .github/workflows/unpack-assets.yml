name: unpack-assets

on:
  push:
    paths:
      - "tmp/*.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack uploaded asset bundles
        run: |
          set -euxo pipefail
          shopt -s nullglob
          zips=(tmp/*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No ZIP bundles found"
            exit 0
          fi
          for zip in "${zips[@]}"; do
            unzip -o "$zip" -d .
            rm -f "$zip"
          done
          rm -f README_ASSETS.md
          mkdir -p tmp
          touch tmp/.gitkeep

      - name: Commit unpacked assets
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/sprites assets tmp
          if git diff --cached --quiet; then
            echo "No asset changes to commit"
            exit 0
          fi
          git commit -m "chore: unpack sprite asset bundle"
          git push
