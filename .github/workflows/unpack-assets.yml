name: unpack-assets

on:
  push:
    paths:
      - "tmp/*.zip"
      - ".github/workflows/unpack-assets.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack uploaded asset bundle
        run: |
          set -euxo pipefail
          ZIP="tmp/midnight-konbini-assets-v1.zip"
          test -f "$ZIP"
          unzip -o "$ZIP" -d .
          rm -f "$ZIP" tmp/.gitkeep README_ASSETS.md

      - name: Commit unpacked assets
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/sprites assets/manifest.json tmp
          if git diff --cached --quiet; then
            echo "No asset changes to commit"
            exit 0
          fi
          git commit -m "chore: unpack sprite asset bundle"
          git push
