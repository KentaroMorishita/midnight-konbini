name: cleanup-merged-branches

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure authenticated remote
        run: |
          git init .branch-cleanup
          cd .branch-cleanup
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      - name: Delete merged PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          cd .branch-cleanup
          case "$BRANCH" in
            feat/*|fix/*|ci/*|chore/*)
              git push origin --delete "$BRANCH" || true
              ;;
          esac

      - name: Sweep merged short-lived branches
        if: github.event_name == 'push'
        run: |
          cd .branch-cleanup
          git fetch origin "+refs/heads/*:refs/remotes/origin/*"

          git branch -r --merged origin/main \
          | sed 's/^[ *]*//' \
          | while read -r ref; do
              branch="${ref#origin/}"
              case "$branch" in
                main|HEAD|"") ;;
                feat/*|fix/*|ci/*|chore/*)
                  git push origin --delete "$branch" || true
                  ;;
              esac
            done
